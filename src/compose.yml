services:
  db:
    image: postgres:18-alpine
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-drogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drogo}
      POSTGRES_DB: ${POSTGRES_DB:-drogo}
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drogo} -d ${POSTGRES_DB:-drogo}"]
        interval: 5s
        timeout: 5s
        retries: 10
    volumes:
        - postgres_data:/var/lib/postgresql
        - ./backend/db/local:/docker-entrypoint-initdb.d:ro
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      - "3000:8080"
    environment:
      TZ: UTC
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy



volumes:
  postgres_data:
  # web_node_modules:
